*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.w{max-width:640px;margin:0 auto;padding:14px}button{font:inherit;cursor:pointer;border:0}
.hero{background:linear-gradient(135deg,#7048e8,#e64980 60%,#f76707);color:#fff;border-radius:22px;padding:20px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px #7048e855}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:6px;box-shadow:0 4px 12px #0003}
.bar{height:7px;background:#fff4;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#fff}
.q{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c1);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 10px #0001}
.qn{display:inline-block;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
.word{font-size:26px;font-weight:800;margin:8px 0 6px;color:color-mix(in srgb,var(--c1) 65%,var(--tx));letter-spacing:.5px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid transparent;border-radius:12px;padding:10px;margin:7px 0;font-size:16px}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 14%,var(--card))}.opt.sel i{background:var(--c1);color:#fff}
.opt.ok{background:var(--grb);border-color:var(--gr)}.opt.ok i{background:var(--gr);color:#fff}.opt.no{background:var(--rdb);border-color:var(--rd)}.opt.no i{background:var(--rd);color:#fff}
.row{display:flex;gap:10px;margin:14px 0}.row>*{flex:1}.btn{border-radius:14px;padding:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 12px #0003}
.btn.alt{background:var(--card);color:color-mix(in srgb,var(--c1) 60%,var(--tx));border:2px solid var(--c1);box-shadow:none}
.score{text-align:center;color:#fff;border-radius:22px;padding:24px 12px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 24px #0003}
.score .e{font-size:54px}.score .n{font-size:46px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:16px;padding:14px 4px;text-align:center;color:#fff;font-size:13px;font-weight:700}.st b{display:block;font-size:30px}
.hi{margin-top:8px;background:linear-gradient(135deg,#2b8a3e,#69db7c);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}.sk{display:inline-block;margin-left:8px;background:#868e96;color:#fff;border-radius:10px;padding:1px 10px;font-size:12px}
.sec{font-size:20px;font-weight:800;margin:14px 2px}.mut{color:var(--mut);font-size:13px;margin-top:6px}
</style></head><body><div class="w" id="app"></div>
